name: Use approved HTFO logo
on:
  push:
    branches: [main]
jobs:
  update-logo-reference:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point header to approved logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'assets/htfo-logo-dark-fixed.png?v=20260815-1'
          new = 'assets/htfo-logo-header-new.jpg?v=20260815-2'
          if old in s:
              s = s.replace(old, new)
          else:
              import re
              s = re.sub(r'assets/htfo-logo[^"\']*', new, s, count=1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use approved HTFO header logo"
          git push
