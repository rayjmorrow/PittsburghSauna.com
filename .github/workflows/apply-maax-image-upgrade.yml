name: Apply MAAX image upgrade
on:
  push:
    paths:
      - 'maax-image-upgrade-trigger.txt'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply image upgrade
        run: python tools/apply_maax_image_upgrade.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html maax-saunas/index.html specials/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade Pittsburgh Sauna with MAAX imagery"
            git push
          fi
