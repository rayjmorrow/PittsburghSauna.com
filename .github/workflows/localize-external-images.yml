name: Localize external images
on:
  push:
    paths:
      - '.github/workflows/localize-external-images.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download externally hosted site images and rewrite pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import hashlib, re

          root = Path('.')
          outdir = root / 'assets' / 'site-images'
          outdir.mkdir(parents=True, exist_ok=True)
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          patterns = [
              re.compile(r"url\((['\"]?)(https://[^)'\"]+)\1\)"),
              re.compile(r"src=(['\"])(https://[^'\"]+)\1"),
          ]
          image_exts = {'.jpg','.jpeg','.png','.webp','.gif','.avif','.svg'}
          cache = {}

          def localize(url, page):
              parsed = urlparse(url)
              ext = Path(parsed.path).suffix.lower()
              if ext not in image_exts:
                  return url
              if url not in cache:
                  base = Path(parsed.path).name or 'image'
                  stem = Path(base).stem[:60]
                  suffix = ext
                  digest = hashlib.sha1(url.encode()).hexdigest()[:10]
                  name = f'{stem}-{digest}{suffix}'
                  dest = outdir / name
                  if not dest.exists():
                      req = Request(url, headers={'User-Agent':'Mozilla/5.0 PittsburghSauna image localizer'})
                      with urlopen(req, timeout=30) as r:
                          data = r.read()
                      dest.write_bytes(data)
                      print(f'Downloaded {url} -> {dest} ({len(data)} bytes)')
                  cache[url] = dest
              dest = cache[url]
              return Path(__import__('os').path.relpath(dest, page.parent)).as_posix()

          changed = 0
          failures = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              original = text

              def css_repl(m):
                  quote, url = m.group(1), m.group(2)
                  try:
                      new = localize(url, page)
                  except Exception as e:
                      failures.append((url, str(e)))
                      return m.group(0)
                  return f'url({quote}{new}{quote})'

              def src_repl(m):
                  quote, url = m.group(1), m.group(2)
                  try:
                      new = localize(url, page)
                  except Exception as e:
                      failures.append((url, str(e)))
                      return m.group(0)
                  return f'src={quote}{new}{quote}'

              text = patterns[0].sub(css_repl, text)
              text = patterns[1].sub(src_repl, text)
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  changed += 1
                  print('Updated', page)

          if failures:
              print('\nFAILED DOWNLOADS:')
              for u,e in failures:
                  print(u, '=>', e)
          print(f'Changed {changed} HTML files; localized {len(cache)} unique images.')
          PY
      - name: Commit localized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-images '*.html' '**/*.html'
          git diff --cached --quiet || git commit -m "Host site product images locally"
          git pull --rebase origin main
          git push
