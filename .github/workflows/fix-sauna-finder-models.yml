name: Fix Sauna Finder Model Recommendations
'on':
  push:
    paths:
      - 'tools/fix_finder_models.py'
      - 'finder-trigger.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Finder patch
        run: python3 tools/fix_finder_models.py
      - name: Commit Finder fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Recommend models for every Sauna Finder path"
          git pull --rebase origin main
          git push
