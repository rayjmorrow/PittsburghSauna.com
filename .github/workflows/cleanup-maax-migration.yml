name: Cleanup MAAX migration
on:
  push:
    paths:
      - 'maax-cleanup-trigger.txt'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run targeted cleanup
        run: python tools/run_maax_cleanup.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Clean up MAAX transition and sauna content"
            git push
          fi
