name: Fix MAAX image upgrade
on:
  push:
    paths:
      - 'maax-image-fix-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/fix_maax_image_upgrade.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maax-saunas/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish MAAX imagery upgrade"
            git push
          fi
