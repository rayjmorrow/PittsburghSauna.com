name: Fix Hekla pricing
on:
  push:
    paths:
      - '.github/workflows/fix-hekla-pricing.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full Hekla page and apply approved infrared pricing
        run: |
          git show 50da5725b7e77e7e2dcbe511750286064714bb8d^:hekla-saunas/index.html > hekla-saunas/index.html
          sed -i 's/<div class="sale">$3,845<\//<div class="sale">$4,495<\//g' hekla-saunas/index.html
          sed -i 's/<div class="sale">$4,745<\/div><div class="price-note">Heating system included/<div class="sale">$4,995<\/div><div class="price-note">Heating system included/g' hekla-saunas/index.html
          sed -i 's/<div class="sale">$5,095<\//<div class="sale">$5,495<\//g' hekla-saunas/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hekla-saunas/index.html
          git commit -m 'Restore full Hekla page and update infrared pricing'
          git push
