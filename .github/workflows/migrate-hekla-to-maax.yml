name: Migrate Hekla to MAAX
on:
  push:
    paths:
      - 'maax-migration-trigger.txt'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run migration
        run: python tools/migrate_hekla_to_maax.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace Hekla with MAAX across Pittsburgh Sauna"
            git push
          fi
