name: Fix HTFO logo final
on:
  push:
    paths:
      - '.github/workflows/fix-logo-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo reference and blend white background into header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(".brand img{width:145px;height:58px;object-fit:contain;border-radius:3px;padding:0}", ".brand img{width:145px;height:58px;object-fit:contain;border-radius:3px;padding:0;mix-blend-mode:multiply;filter:brightness(1.65) saturate(1.7)}")
          import re
          s=re.sub(r'<img src="assets/htfo-logo[^\"]*" alt="Hot Tub Factory Outlet">', '<img src="assets/htfo-logo.jpg?v=20260815-final" alt="Hot Tub Factory Outlet">', s)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix HTFO header logo" || exit 0
          git push
