name: Refine Special Savings
'on':
  push:
    paths:
      - 'tools/refine_special_savings.py'
      - 'special-savings-trigger.txt'
jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refine Special Savings page
        run: python3 tools/refine_special_savings.py
      - name: Commit Special Savings updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/index.html'
          git diff --cached --quiet || git commit -m "Refine Special Savings page"
          git pull --rebase origin main
          git push
