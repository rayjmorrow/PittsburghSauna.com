name: Use approved HTFO logo direct
on:
  workflow_dispatch:
jobs:
  update-logo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point header to verified logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("assets/htfo-logo-header-new.jpg?v=20260815-2","assets/htfo-logo-approved.jpg?v=20260815-3")
          s=s.replace(";mix-blend-mode:multiply;filter:brightness(1.65) saturate(1.7)","")
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use verified HTFO logo asset"
          git push
