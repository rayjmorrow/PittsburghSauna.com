name: Fix brand links
on:
  push:
    paths:
      - 'brand-links-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix sitewide brand links
        run: python tools/fix_brand_links.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || true
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Link HTFO logo to HTFO and Pittsburgh Sauna logo home"
            git push
          fi
